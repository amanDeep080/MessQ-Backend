services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: messq
      POSTGRES_USER: messq
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - messq-data:/var/lib/postgresql/data
volumes:
  messq-data:
